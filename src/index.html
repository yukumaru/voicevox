<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.08);
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-hint: #aaaaaa;
    --accent: #5b6af0;
    --accent-light: #eef0ff;
    --danger: #e85050;
    --danger-light: #fff0f0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }

  /* タイトルバー */
  .titlebar {
    height: 44px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px 0 80px;
    -webkit-app-region: drag;
    flex-shrink: 0;
    gap: 10px;
  }
  .titlebar-avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--accent-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .titlebar-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .titlebar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .speaker-sel {
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    background: var(--bg);
    color: var(--text-primary);
    cursor: pointer;
  }

  /* APIキー設定 */
  .apikey-bar {
    background: #fffbe6;
    border-bottom: 1px solid #ffe58f;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .apikey-bar.hidden { display: none; }
  .apikey-bar label { font-size: 12px; color: #7a5c00; white-space: nowrap; }
  .apikey-bar input {
    flex: 1;
    font-size: 12px;
    border: 1px solid #ffd666;
    border-radius: 5px;
    padding: 4px 8px;
    background: white;
    font-family: monospace;
  }
  .apikey-bar button {
    font-size: 12px;
    padding: 4px 10px;
    border: none;
    border-radius: 5px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }

  /* チャット */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-hint);
    padding: 40px;
    text-align: center;
  }
  .empty-icon { font-size: 40px; margin-bottom: 4px; }
  .empty-title { font-size: 15px; font-weight: 500; color: var(--text-secondary); }
  .empty-sub { font-size: 13px; line-height: 1.6; }

  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 80%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-label { font-size: 11px; color: var(--text-hint); padding: 0 4px; }
  .msg-bubble {
    font-size: 14px;
    line-height: 1.7;
    padding: 10px 14px;
    border-radius: 16px;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--accent);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .msg-bubble {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }

  .thinking-bubble {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 12px 16px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-hint);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* 入力エリア */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
  }

  .status-bar {
    font-size: 12px;
    color: var(--text-hint);
    text-align: center;
    min-height: 16px;
    transition: color 0.2s;
  }
  .status-bar.listening { color: var(--danger); font-weight: 500; }
  .status-bar.speaking { color: var(--accent); }
  .status-bar.error { color: var(--danger); }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    resize: none;
    height: 44px;
    max-height: 120px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text-primary);
    transition: border-color 0.15s;
    overflow: hidden;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    color: var(--text-secondary);
  }
  .btn:hover { background: var(--bg); transform: scale(1.05); }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-mic.listening {
    background: var(--danger-light);
    border-color: var(--danger);
    color: var(--danger);
    animation: pulse 1.5s infinite;
  }
  .btn-send {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    border-radius: 12px;
  }
  .btn-send:hover { background: #4757d6; }
  .btn-send:disabled { background: var(--border); border-color: transparent; color: var(--text-hint); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,80,80,0.4); }
    50% { box-shadow: 0 0 0 8px rgba(232,80,80,0); }
  }
</style>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-avatar" id="avatar">つ</div>
  <span class="titlebar-name" id="speaker-name">春日部つむぎ</span>
  <div class="titlebar-right">
    <select class="speaker-sel" id="speaker-sel">
      <option value="ずんだもん">ずんだもん</option>
      <option value="四国めたん">四国めたん</option>
      <option value="春日部つむぎ" selected>春日部つむぎ</option>
      <option value="波音リツ">波音リツ</option>
      <option value="雨晴はう">雨晴はう</option>
      <option value="WhiteCUL">WhiteCUL</option>
      <option value="後鬼">後鬼</option>
      <option value="No.7">No.7</option>
      <option value="ちび式じい">ちび式じい</option>
      <option value="青山龍星">青山龍星</option>
    </select>
  </div>
</div>

<div class="apikey-bar" id="apikey-bar">
  <label>Anthropic</label>
  <input type="password" id="apikey-input" placeholder="sk-ant-..." />
  <label style="margin-left:8px;">OpenAI</label>
  <input type="password" id="openai-input" placeholder="sk-..." />
  <button id="apikey-save">保存</button>
</div>

<div class="chat-area" id="chat-area">
  <div class="empty-state" id="empty-state">
    <div class="empty-icon">🎙️</div>
    <div class="empty-title">話しかけてみてください</div>
    <div class="empty-sub">マイクボタンを押して声で入力するか<br>テキストを入力してEnterを押してください</div>
  </div>
</div>

<div class="input-area">
  <div class="status-bar" id="status-bar"></div>
  <div class="input-row">
    <textarea id="text-input" placeholder="メッセージを入力..." rows="1"></textarea>
    <button class="btn btn-mic" id="btn-mic" title="音声入力">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="9" y1="22" x2="15" y2="22"/>
      </svg>
    </button>
    <button class="btn btn-send" id="btn-send" title="送信" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>
</div>

<script>
const SPEAKER_MAP = {
  'ずんだもん': 3, '四国めたん': 2, '春日部つむぎ': 8,
  '波音リツ': 9, '雨晴はう': 10, 'WhiteCUL': 65,
  '後鬼': 69, 'No.7': 29, 'ちび式じい': 42, '青山龍星': 13
}
const AVATAR_MAP = {
  'ずんだもん': 'ず', '四国めたん': 'め', '春日部つむぎ': 'つ',
  '波音リツ': 'リ', '雨晴はう': 'は', 'WhiteCUL': 'W',
  '後鬼': '後', 'No.7': '7', 'ちび式じい': 'じ', '青山龍星': '龍'
}

let speaker = '春日部つむぎ'
let history = []
let apiKey = localStorage.getItem('anthropic_api_key') || ''
let openaiKey = localStorage.getItem('openai_api_key') || ''
let isBusy = false
let isListening = false

const chatArea = document.getElementById('chat-area')
const emptyState = document.getElementById('empty-state')
const textInput = document.getElementById('text-input')
const btnMic = document.getElementById('btn-mic')
const btnSend = document.getElementById('btn-send')
const statusBar = document.getElementById('status-bar')
const speakerSel = document.getElementById('speaker-sel')
const speakerName = document.getElementById('speaker-name')
const avatar = document.getElementById('avatar')
const apikeyBar = document.getElementById('apikey-bar')
const apikeyInput = document.getElementById('apikey-input')
const openaiInput = document.getElementById('openai-input')

// APIキー設定
if (apiKey && openaiKey) apikeyBar.classList.add('hidden')
document.getElementById('apikey-save').addEventListener('click', () => {
  apiKey = apikeyInput.value.trim()
  openaiKey = openaiInput.value.trim()
  if (apiKey) localStorage.setItem('anthropic_api_key', apiKey)
  if (openaiKey) localStorage.setItem('openai_api_key', openaiKey)
  if (apiKey && openaiKey) {
    apikeyBar.classList.add('hidden')
    setStatus('APIキーを保存しました')
    setTimeout(() => setStatus(''), 2000)
  }
})

// 話者変更
speakerSel.addEventListener('change', () => {
  speaker = speakerSel.value
  speakerName.textContent = speaker
  avatar.textContent = AVATAR_MAP[speaker] || speaker[0]
})

function setStatus(msg, cls = '') {
  statusBar.textContent = msg
  statusBar.className = 'status-bar' + (cls ? ` ${cls}` : '')
}

function addMessage(role, text) {
  emptyState && (emptyState.style.display = 'none')
  const div = document.createElement('div')
  div.className = `msg ${role}`
  const label = document.createElement('div')
  label.className = 'msg-label'
  label.textContent = role === 'user' ? 'あなた' : speaker
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble'
  bubble.textContent = text
  div.append(label, bubble)
  chatArea.appendChild(div)
  chatArea.scrollTop = chatArea.scrollHeight
  return bubble
}

function addThinking() {
  emptyState && (emptyState.style.display = 'none')
  const div = document.createElement('div')
  div.className = 'msg assistant'
  div.id = 'thinking'
  const label = document.createElement('div')
  label.className = 'msg-label'
  label.textContent = speaker
  const bubble = document.createElement('div')
  bubble.className = 'msg-bubble thinking-bubble'
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>'
  div.append(label, bubble)
  chatArea.appendChild(div)
  chatArea.scrollTop = chatArea.scrollHeight
  return div
}

async function speakVoicevox(text) {
  const speakerId = SPEAKER_MAP[speaker] || 3
  try {
    setStatus('読み上げ中...', 'speaking')
    const query = await window.electronAPI.voicevoxQuery({ text, speakerId })
    const base64 = await window.electronAPI.voicevoxSynthesis({ query, speakerId })
    const binary = atob(base64)
    const bytes = new Uint8Array(binary.length)
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
    const blob = new Blob([bytes], { type: 'audio/wav' })
    const url = URL.createObjectURL(blob)
    const audio = new Audio(url)
    await audio.play()
    await new Promise(r => { audio.onended = r; audio.onerror = r })
    URL.revokeObjectURL(url)
  } catch (e) {
    setStatus('VOICEVOXに接続できません。起動しているか確認してください。', 'error')
    await new Promise(r => setTimeout(r, 3000))
  }
}

async function sendMessage(text) {
  text = text.trim()
  if (!text || isBusy) return
  if (!apiKey) {
    apikeyBar.classList.remove('hidden')
    setStatus('APIキーを設定してください', 'error')
    return
  }

  isBusy = true
  btnSend.disabled = true
  textInput.value = ''
  textInput.style.height = '44px'

  addMessage('user', text)
  history.push({ role: 'user', content: text })

  const thinking = addThinking()
  setStatus('考え中...')

  try {
    const data = await window.electronAPI.claudeAPI({ messages: history, speaker })
    thinking.remove()

    const reply = data.content?.[0]?.text || 'うまく答えられませんでした。'
    addMessage('assistant', reply)
    history.push({ role: 'assistant', content: reply })

    await speakVoicevox(reply)
    setStatus('')
  } catch (e) {
    thinking.remove()
    setStatus('エラーが発生しました: ' + e.message, 'error')
  }

  isBusy = false
  btnSend.disabled = false
}

// テキスト入力
textInput.addEventListener('input', () => {
  textInput.style.height = '44px'
  textInput.style.height = Math.min(textInput.scrollHeight, 120) + 'px'
  btnSend.disabled = !textInput.value.trim()
})
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage(textInput.value)
  }
})

btnSend.addEventListener('click', () => sendMessage(textInput.value))

// 音声認識 (Whisper API)
let mediaRecorder = null
let audioChunks = []

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    audioChunks = []

    // Whisper APIが確実に対応しているmimeTypeを選ぶ
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/webm')
      ? 'audio/webm'
      : 'audio/ogg'

    mediaRecorder = new MediaRecorder(stream, { mimeType })
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data)
    }
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop())
      if (!audioChunks.length) return
      const blob = new Blob(audioChunks, { type: mimeType })
      await transcribeAudio(blob, mimeType)
    }
    mediaRecorder.start(100) // 100msごとにデータを収集
    isListening = true
    btnMic.classList.add('listening')
    setStatus('聞いています... (もう一度押すと送信)', 'listening')
  } catch(e) {
    setStatus('マイクの許可が必要です: ' + e.message, 'error')
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    isListening = false
    btnMic.classList.remove('listening')
    setStatus('認識中...', 'speaking')
    mediaRecorder.stop()
  }
}

async function transcribeAudio(blob, mimeType) {
  const openaiKey = localStorage.getItem('openai_api_key') || ''
  if (!openaiKey) {
    setStatus('OpenAI APIキーを設定してください', 'error')
    return
  }
  try {
    const reader = new FileReader()
    const base64 = await new Promise(r => {
      reader.onload = () => r(reader.result.split(',')[1])
      reader.readAsDataURL(blob)
    })
    // mimeTypeに応じた拡張子を設定
    const ext = mimeType.includes('ogg') ? 'ogg' : 'webm'
    const data = await window.electronAPI.whisperAPI({ audioBase64: base64, apiKey: openaiKey, ext })
    if (data.text && data.text.trim()) {
      sendMessage(data.text.trim())
    } else {
      setStatus('音声を認識できませんでした', 'error')
      setTimeout(() => setStatus(''), 2000)
    }
  } catch(e) {
    setStatus('Whisper APIエラー: ' + e.message, 'error')
  }
}

btnMic.addEventListener('click', () => {
  if (isBusy) return
  if (isListening) {
    stopRecording()
  } else {
    startRecording()
  }
})
</script>
</body>
</html>
